_schema-version: 3.3.0

ID: CAPM_PROJECT
version: 1.0.0

description: "CAP project with HANA"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ==================================================
  # CAP Backend
  # ==================================================
  - name: CAPM_PROJECT-srv
    type: nodejs
    path: gen/srv

    parameters:
      instances: 1
      buildpack: nodejs_buildpack

    build-parameters:
      builder: npm-ci

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: CAPM_PROJECT-auth
      - name: CAPM_PROJECT-db

  # ==================================================
  # HANA DB Deployer
  # ==================================================
  - name: CAPM_PROJECT-db-deployer
    type: hdb
    path: gen/db

    parameters:
      buildpack: nodejs_buildpack

    requires:
      - name: CAPM_PROJECT-db

  # ==================================================
  # App Router
  # ==================================================
  - name: CAPM_PROJECT
    type: approuter.nodejs
    path: app/router

    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M

    requires:

      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

      - name: CAPM_PROJECT-auth

    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

# ==================================================
# RESOURCES
# ==================================================

resources:

  # ==================================================
  # XSUAA
  # ==================================================
  - name: CAPM_PROJECT-auth
    type: org.cloudfoundry.managed-service

    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

      config:
        xsappname: CAPM_PROJECT-${org}-${space}
        tenant-mode: dedicated

        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"

          redirect-uris:
            - https://*~{app-api/app-uri}/**

    requires:
      - name: app-api

  # ==================================================
  # EXISTING PRACTICE HANA HDI CONTAINER
  # ==================================================
  - name: CAPM_PROJECT-db
    type: org.cloudfoundry.existing-service

    parameters:
      service-name: PracticeHDi-freeInstance
  - name: CAPM_PROJECT-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
